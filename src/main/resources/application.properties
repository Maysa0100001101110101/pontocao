# Configuração correta para o seu SQLEXPRESS
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=pontocaodb;encrypt=true;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=@ITB123456
 
# Configurações do Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
 
# Porta da API
server.port=8085
